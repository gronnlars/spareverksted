        run: SPARE_ENGINE=firefox node tests/published-answers-browser.cjs
      - name: "tests/published-answers-browser.cjs (webkit)"
        id: published_webkit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/published-answers-browser.cjs
      - name: "tests/svarmal-browser.cjs (chromium)"
        env:
          SPARE_PUBLICATION_CHECKED: ${{ steps.published_chromium.outcome == 'success' && format('{0}:{1}:{2}:chromium', github.run_id, github.run_attempt, github.sha) || '' }}
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/svarmal-browser.cjs
      - name: "tests/svarmal-browser.cjs (firefox)"
        env:
          SPARE_PUBLICATION_CHECKED: ${{ steps.published_firefox.outcome == 'success' && format('{0}:{1}:{2}:firefox', github.run_id, github.run_attempt, github.sha) || '' }}
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/svarmal-browser.cjs
      - name: "tests/svarmal-browser.cjs (webkit)"
