name: Test and publish Spareverksted
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: spareverksted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      browser_required: ${{ steps.scope.outputs.browser_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine browser test scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python3 tests/ci-omfang.test.py
          REQUIRED=$(python3 scripts/ci-omfang.py --event "$CI_EVENT" --base "origin/$CI_BASE_REF")
          echo "browser_required=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "Browser tests required: $REQUIRED. Main always runs the full suite." >> "$GITHUB_STEP_SUMMARY"
      # Stopper PR-er og push som legger tilbake en eldre versjon av motor, sider eller tester (scripts/foreldet.py).
      # Publisering venter på denne jobben, så gammel kode når aldri spareverksted.no.
      - name: Stop old code
        run: |
          python3 tests/foreldet.test.py
          python3 scripts/foreldet.py --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check calculations and guidance
        run: |
          node tests/engine.test.cjs
          node tests/laan-motor.test.cjs
          python3 tests/laan-kontroll.test.py
          node tests/laan-tekst.test.cjs
          node tests/laan-eksport.test.cjs
          node tests/laan-visning.test.cjs
          python3 tests/laan-verdi-kontroll.test.py
          node tests/tax-export.test.cjs
          node tests/veileder.test.cjs
          node tests/veileder-context.test.cjs
          node tests/veileder-grunnbegreper.test.cjs
          python3 research/svarutkast/generer-gaps.py --check --product
          node tests/veileder-knowledge.test.cjs
          python3 scripts/versjoner.py --check
          python3 tests/versjoner.test.py
          python3 scripts/fakta.py --check
          python3 tests/fakta.test.py
          python3 scripts/svar.py --check
          python3 tests/svar.test.py
          node tests/svar-generated.test.cjs
          python3 tests/kildevakt.test.py
          python3 scripts/generate-bsu-rates.py --check
          node tests/bsu-rates.test.cjs
          node tests/svarmal.test.cjs
          node tests/svartekst.test.cjs
          node tests/veileder-relevance.test.cjs
          node tests/veileder-sok.test.cjs
          node tests/veileder-sok-utvidet.test.cjs
          node tests/veileder-sok-rettinger.test.cjs
          node tests/validation.test.cjs
          node tests/kjopekraft.test.cjs
          node tests/results.test.cjs
          node tests/meaning.test.cjs
          node tests/chart-summary.test.cjs
          node tests/band.test.cjs
          python3 scripts/security-check.py
          python3 tests/security-check.test.py
          python3 tests/deploy_bunny.test.py
          node tests/personvern-lagring.test.cjs
          node tests/published-answers.test.cjs
          node tests/publication-preflight.test.cjs
          node tests/begreper.test.cjs
          node --check dist/personvern.js
          node --check dist/kontakt.js
          node --check dist/veileder-ui.js
          node --check dist/veileder-sok.js
          node --check dist/veileder-bridge.js
          node --check dist/veileder-facts.js
          node --check dist/app.js
          node --check dist/layout.js
          node --check dist/engine.js
          node --check dist/laan-motor.js
          node --check dist/laan-tekst.js
          node --check dist/laan.js
          node --check dist/guidance.js
          node --check dist/journey.js
          node --check dist/meaning.js
          node --check dist/chart-summary.js
          node --check dist/assumptions.js
          node --check dist/theme.js
          node --check dist/navigation.js
          node tests/w3c-status.test.cjs
          python3 tests/personvern-status.test.py
      - name: Offline resource inventory
        run: python3 scripts/ressurskontroll.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, kontrollert 2026-11-05
        with:
          distribution: temurin
          java-version: '21'
      # Nu Html Checker, the validator behind validator.w3.org. Fails on errors, reports warnings.
      - name: W3C validator on all pages
        run: |
          npm install --no-save --no-package-lock vnu-jar
          JAR=node_modules/vnu-jar/build/dist/vnu.jar
          java -jar "$JAR" --format json --stdout --exit-zero-always dist/*.html > /tmp/w3c.json
          python3 scripts/w3c-status.py /tmp/w3c.json "$(java -jar "$JAR" --version)" >> "$GITHUB_STEP_SUMMARY"
  browser:
    needs: checks
    # Main always runs in full; only allowlisted Markdown-only PRs skip browsers.
    if: ${{ needs.checks.outputs.browser_required == 'true' }}
    runs-on: ubuntu-latest
    env:
      SPARE_PRIVACY_REPORT: /tmp/spareverksted-privacy
    # Playwrights eget testbilde har Chromium og systempakkene ferdig installert.
    # Versjonen må være lik playwright-pakken under.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        id: install
        run: npm install --no-save --no-package-lock playwright@1.56.0 vnu-jar
      # Actions mounts /github/home with the host runner's uid; the container runs as root.
      # Firefox requires the home directory to belong to the browser's current user.
      - name: Match CI home ownership for Firefox
        run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, kontrollert 2026-11-05
        with:
          distribution: temurin
          java-version: '21'
          java-package: jre
      - name: "HTML report: chromium and firefox"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        env:
          SPARE_HTML_VALIDATOR: node_modules/vnu-jar/build/dist/vnu.jar
          SPARE_HTML_OUTPUT_DIR: /tmp/spareverksted-ui-review/html
        run: |
          logs=$(mktemp -d "${RUNNER_TEMP:-/tmp}/spare-html-checks.XXXXXX")
          SPARE_ENGINE=chromium node tests/rapport-html-browser.cjs > "$logs/chromium.log" 2>&1 &
          chromium_pid=$!
          SPARE_ENGINE=firefox node tests/rapport-html-browser.cjs > "$logs/firefox.log" 2>&1 &
          firefox_pid=$!
          chromium_status=0
          firefox_status=0
          wait "$chromium_pid" || chromium_status=$?
          wait "$firefox_pid" || firefox_status=$?
          echo '::group::HTML report: chromium'
          cat "$logs/chromium.log"
          echo '::endgroup::'
          echo '::group::HTML report: firefox'
          cat "$logs/firefox.log"
          echo '::endgroup::'
          echo "HTML report exit codes: chromium=$chromium_status firefox=$firefox_status"
          test "$chromium_status" -eq 0 && test "$firefox_status" -eq 0
      - name: "tests/rapport-html-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          SPARE_HTML_VALIDATOR: node_modules/vnu-jar/build/dist/vnu.jar
          SPARE_HTML_OUTPUT_DIR: /tmp/spareverksted-ui-review/html
        run: SPARE_ENGINE=webkit node tests/rapport-html-browser.cjs
      - name: "tests/security-browser.cjs (chromium)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/security-browser.cjs
      - name: "tests/security-browser.cjs (firefox)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/security-browser.cjs
      - name: "tests/security-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/security-browser.cjs
      - name: "tests/published-answers-browser.cjs (chromium)"
        id: published_chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/published-answers-browser.cjs
      - name: "tests/published-answers-browser.cjs (firefox)"
