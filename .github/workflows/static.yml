      - name: "tests/begrep-browser.cjs (chromium)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/begrep-browser.cjs
      - name: "tests/begrep-browser.cjs (firefox)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/begrep-browser.cjs
      - name: "tests/begrep-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/begrep-browser.cjs
      - name: "tests/infosider-browser.cjs (chromium)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/infosider-browser.cjs
      - name: "tests/infosider-browser.cjs (firefox)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/infosider-browser.cjs
      - name: "tests/infosider-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/infosider-browser.cjs
      - name: "tests/kontakt-browser.cjs (chromium)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/kontakt-browser.cjs
      - name: "tests/kontakt-browser.cjs (firefox)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/kontakt-browser.cjs
      - name: "tests/kontakt-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/kontakt-browser.cjs
      - name: "tests/felt-browser.cjs (firefox)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=firefox node tests/felt-browser.cjs
      - name: "tests/felt-browser.cjs (webkit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: SPARE_ENGINE=webkit node tests/felt-browser.cjs
      - name: Write verified privacy result
        id: privacy_report
        if: ${{ !cancelled() && steps.privacy_chromium.outcome == 'success' && steps.privacy_firefox.outcome == 'success' && steps.privacy_webkit.outcome == 'success' }}
        run: python3 scripts/personvern-status.py /tmp/spareverksted-privacy
      - name: Privacy evidence
        if: ${{ !cancelled() && steps.privacy_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: privacy-evidence
          path: /tmp/spareverksted-privacy
          if-no-files-found: error
          retention-days: 30
      - name: Verified privacy page
        if: ${{ !cancelled() && steps.privacy_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: privacy-page
          path: dist/personvern.html
      - name: Verify privacy artifact download before publishing
        if: ${{ !cancelled() && steps.privacy_report.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, includes GHSA-cxww-7g56-2vh6 fix
        with:
          name: privacy-page
          path: ${{ runner.temp }}/privacy-roundtrip
      - name: Compare downloaded privacy page with verified original
        if: ${{ !cancelled() && steps.privacy_report.outcome == 'success' }}
        env:
          PRIVACY_ROUNDTRIP: ${{ runner.temp }}/privacy-roundtrip
        run: cmp dist/personvern.html "$PRIVACY_ROUNDTRIP/personvern.html"
      - name: UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: /tmp/spareverksted-ui-review
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, includes GHSA-cxww-7g56-2vh6 fix
        with:
          name: privacy-page
          path: dist
      - name: Build source download
        run: python3 scripts/package-source.py
      - name: Remove unpublished loan page from site artifact
        run: |
          rm -f dist/laan.html dist/lan.html
          test ! -e dist/laan.html
          test ! -e dist/lan.html
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, kontrollert 2026-11-05
        with:
          distribution: temurin
          java-version: '21'
      # Writes the result into the published copy of tilgjengelighet.html only. Nothing is committed.
      - name: Write W3C result into the accessibility page
        run: |
          npm install --no-save --no-package-lock vnu-jar
          JAR=node_modules/vnu-jar/build/dist/vnu.jar
          VERSION="$(java -jar "$JAR" --version)"
          java -jar "$JAR" --format json --stdout --exit-zero-always dist/*.html > /tmp/w3c.json
          python3 scripts/w3c-status.py /tmp/w3c.json "$VERSION" --write
          java -jar "$JAR" --errors-only dist/tilgjengelighet.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Bunny S3 client
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-deploy.txt
      - name: Deploy verified site to Bunny Storage (Frankfurt)
        env:
          BUNNY_STORAGE_ZONE: spareverksted
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: python3 scripts/deploy_bunny.py dist
      # Tømmer CDN-cachen så besøkende ikke får blanding av gamle og nye filer.
      - name: Purge Bunny CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ vars.BUNNY_PULLZONE_ID }}
        run: |
          test -n "$BUNNY_API_KEY" || { echo "BUNNY_API_KEY mangler"; exit 1; }
          case "$BUNNY_PULLZONE_ID" in ''|*[!0-9]*) echo "BUNNY_PULLZONE_ID må være et tall"; exit 1;; esac
          curl -fsS -X POST \
            "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
