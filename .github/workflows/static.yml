name: Test and publish Spareverksted
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check calculations and guidance
        run: |
          node tests/engine.test.cjs
          node tests/tax-export.test.cjs
          node tests/veileder.test.cjs
          node tests/veileder-context.test.cjs
          node tests/veileder-grunnbegreper.test.cjs
          python3 research/svarutkast/generer-gaps.py --check --product
          node tests/veileder-knowledge.test.cjs
          node tests/veileder-relevance.test.cjs
          node tests/veileder-sok.test.cjs
          node tests/veileder-sok-utvidet.test.cjs
          node tests/veileder-sok-rettinger.test.cjs
          node tests/validation.test.cjs
          node tests/kjopekraft.test.cjs
          node tests/results.test.cjs
          node tests/meaning.test.cjs
          node tests/chart-summary.test.cjs
          node tests/band.test.cjs
          node tests/personvern-lagring.test.cjs
          node --check dist/personvern.js
          node --check dist/kontakt.js
          node --check dist/veileder-ui.js
          node --check dist/veileder-sok.js
          node --check dist/veileder-bridge.js
          node --check dist/veileder-facts.js
          node --check dist/app.js
          node --check dist/layout.js
          node --check dist/engine.js
          node --check dist/guidance.js
          node --check dist/journey.js
          node --check dist/meaning.js
          node --check dist/chart-summary.js
          node --check dist/assumptions.js
          node --check dist/theme.js
          node --check dist/navigation.js
  browser:
    runs-on: ubuntu-latest
    # Playwrights eget testbilde har Chromium og systempakkene ferdig installert.
    # Versjonen må være lik playwright-pakken under.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.0
      # Actions mounts /github/home with the host runner's uid; the container runs as root.
      # Firefox requires the home directory to belong to the browser's current user.
      - name: Match CI home ownership for Firefox
        run: chown "$(id -u):$(id -g)" /github/home
      - name: Browser flows (Chromium)
        run: |
          node tests/ask-browser.cjs
          SPARE_ENGINE=firefox node tests/ask-browser.cjs
          SPARE_ENGINE=webkit node tests/ask-browser.cjs
          node tests/input-browser.cjs
          node tests/veileder-browser.cjs
          node research/svarutkast/prov-renters-browser.cjs
          SPARE_ENGINE=firefox node research/svarutkast/prov-renters-browser.cjs
          SPARE_ENGINE=webkit node research/svarutkast/prov-renters-browser.cjs
          node tests/veileder-sok-browser.cjs
          node tests/veileder-sok-rettinger-browser.cjs
          SPARE_ENGINE=firefox node tests/veileder-sok-rettinger-browser.cjs
          SPARE_ENGINE=webkit node tests/veileder-sok-rettinger-browser.cjs
          node tests/startflyt-browser.cjs
          node tests/ki-info-browser.cjs
          SPARE_ENGINE=firefox node tests/ki-info-browser.cjs
          SPARE_ENGINE=webkit node tests/ki-info-browser.cjs
          node tests/spareform-browser.cjs
          node tests/theme-browser.cjs
          node tests/navigation-browser.cjs
          node tests/roundtrip-browser.cjs
          node tests/deling-browser.cjs
          SPARE_ENGINE=firefox node tests/deling-browser.cjs
          SPARE_ENGINE=webkit node tests/deling-browser.cjs
          node tests/a11y-browser.cjs
          node tests/akse-browser.cjs
          node tests/polish-browser.cjs
          SPARE_ENGINE=firefox node tests/polish-browser.cjs
          SPARE_ENGINE=webkit node tests/polish-browser.cjs
          node tests/felt-browser.cjs
          node tests/personvern-browser.cjs
          SPARE_ENGINE=firefox node tests/personvern-browser.cjs
          SPARE_ENGINE=webkit node tests/personvern-browser.cjs
          node tests/kontakt-browser.cjs
          SPARE_ENGINE=firefox node tests/kontakt-browser.cjs
          SPARE_ENGINE=webkit node tests/kontakt-browser.cjs
          SPARE_ENGINE=firefox node tests/felt-browser.cjs
          SPARE_ENGINE=webkit node tests/felt-browser.cjs
      - name: UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: /tmp/spareverksted-ui-review
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, browser]
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source download
        run: python3 scripts/package-source.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
