name: Deploy to Bunny.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Sjekk ut kode
      uses: actions/checkout@v4

    - name: Rens og last opp til Bunny Storage
      uses: amandepmittal/bunny-storage-deploy-action@v2.0.0
      with:
        source: './dist'
        storageZoneName: 'spareverksted'
        storagePassword: ${{ secrets::BUNNY_STORAGE_PASSWORD }}
        zoneRegion: 'de' 
        purgePullZone: true 
