name: UU source monitor
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/uu-monitor.py
      - tests/uu-monitor-test.py
      - research/uu-monitor-sources.json
      - .github/workflows/uu-monitor.yml
permissions:
  contents: read
concurrency:
  group: uu-source-monitor-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/uu-monitor-test.py
  observe:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last successful observations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const found = issues.find(i => !i.pull_request && i.body?.includes('<!-- spareverksted-uu-monitor -->'));
            fs.mkdirSync('tmp/uu-monitor', {recursive:true});
            const match = found?.body?.match(/<!-- uu-state:(.*?) -->/s);
            fs.writeFileSync('tmp/uu-monitor/previous.json', match ? JSON.stringify(JSON.parse(match[1])) : '{}');
            if(found) fs.writeFileSync('tmp/uu-monitor/issue-number', String(found.number));
      - name: Observe official sources
        id: observation
        continue-on-error: true
        run: python3 scripts/uu-monitor.py --previous tmp/uu-monitor/previous.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uu-source-observation-${{ github.run_id }}
          path: tmp/uu-monitor/
          retention-days: 90
      - name: Update monitoring issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'tmp/uu-monitor/';
            const read = f => fs.readFileSync(dir+f,'utf8');
            const report = fs.existsSync(dir+'report.json') ? JSON.parse(read('report.json')) : null;
            const state = fs.existsSync(dir+'state.json') ? JSON.parse(read('state.json')) : JSON.parse(read('previous.json'));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fingerprint = JSON.stringify(report ? report.sources.map(s=>[s.id,s.status==='error'?'error':'observed',s.sha256||null,s.review_status||null]) : ['run-failed']);
            const summary = report ? read('summary.md') : 'Kildekontrollen fullførte ikke. Ingen ny kontrollstatus kan oppgis.';
            const body = `<!-- spareverksted-uu-monitor -->\n${summary}\nSiste forsøk: ${new Date().toISOString()}\n\n[Kjøring og kildesnapshot](${run})\n\nDette endrer ingen lovtolkning, standardmål, teststatus eller publisert brukertekst.\n\n<!-- uu-state:${JSON.stringify(state)} -->\n<!-- uu-fingerprint:${fingerprint} -->`;
            const number = fs.existsSync(dir+'issue-number') ? Number(read('issue-number')) : null;
            if(number) {
              const old = await github.rest.issues.get({...context.repo, issue_number:number});
              const previous = old.data.body.match(/<!-- uu-fingerprint:(.*?) -->/s)?.[1];
              await github.rest.issues.update({...context.repo, issue_number:number, body});
              if(previous !== fingerprint) await github.rest.issues.createComment({...context.repo, issue_number:number, body:`Ny kildeendring eller endret hentestatus. [Se rapporten](${run}). Krever gjennomgang, ikke automatisk regelendring.`});
            } else await github.rest.issues.create({...context.repo, title:'UU: løpende kildeovervåking og åpne kontroller', body});
      - name: Fail visibly when collection failed
        if: steps.observation.outcome == 'failure'
        run: exit 1
